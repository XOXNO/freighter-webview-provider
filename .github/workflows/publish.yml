name: npm publish

on:
  push:
    branches:
      - main
  # Manual re-run for when a push happened before the npm trusted publisher existed.
  workflow_dispatch:

# One release at a time: two pushes in quick succession must not race on the version bump commit.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # Bump, publish, then push the bump: a failed publish leaves main untouched instead of burning a version per retry.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore(release): %s [skip ci]"

      # prepack runs the build; trusted publishing (OIDC) needs no token.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''
          # Verbose so a failed OIDC token exchange says why instead of a bare ENEEDAUTH.
          NPM_CONFIG_LOGLEVEL: verbose

      - run: git push --follow-tags
