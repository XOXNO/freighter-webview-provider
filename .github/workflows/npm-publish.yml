name: npm publish

on:
  push:
    branches:
      - main
  # Manual re-run for when a push happened before the npm trusted publisher existed.
  workflow_dispatch:

# One release at a time: two pushes in quick succession must not race on the version bump commit.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  bump-version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The bump commit message carries [skip ci] so pushing it back does not trigger this workflow again.
      - run: |
          npm version patch -m "chore(release): %s [skip ci]"

      - run: git push --follow-tags

  publish:
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # prepack runs the build; trusted publishing (OIDC) needs no token.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''
